<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View PDF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-image: linear-gradient(to right, #83a4d4, #b6fbff);
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .navbar {
            width: 100%;
            background-color: #7791a8;
            color: white;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            position: relative;
        }

        /* Button Container */
        .button-container {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .button {
            padding: 5px 10px;
            font-size: 14px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #d32f2f;
        }

        .back-button {
            background-color: #0073e6;
        }

        .back-button:hover {
            background-color: #005bb5;
        }

        /* Main Content Wrapper */
        .content-wrapper {
            width: 80%;
            max-width: 1000px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Content Container Styling */
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* PDF Viewer Styling */
        .pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow-y: scroll; /* Allow vertical scrolling */
        }

        /* Loading Animation */
        .loading {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0073e6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<div class="navbar">
    View PDF
    <div class="button-container">
        <button class="button logout-button" id="logoutButton">Logout</button>
        <button class="button back-button" id="backButton">Go Back</button>
    </div>
</div>

<!-- Main Content Wrapper -->
<div class="content-wrapper">
    <div class="container">
        <h2 id="patient-id-title"></h2>
        <div class="loading" id="loading"></div>
        <iframe class="pdf-viewer" id="pdfViewer" src=""></iframe>
    </div>
</div>

<script>
    // Show loading animation
    function showLoading() {
        document.getElementById('loading').style.display = 'block';
    }

    // Hide loading animation
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const patientId = localStorage.getItem('patientId');
        document.getElementById('patient-id-title').textContent = `Viewing PDF for Patient ID: ${patientId}`;

        showLoading();

        // Fetch the PDF URL from the backend
        fetch(`/fabric/doctor/view-pdf?patientId=${patientId}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('jwt')}` // Assuming JWT is stored in localStorage
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.blob();
        })
        .then(blob => {
            const url = URL.createObjectURL(blob);
            const pdfViewer = document.getElementById('pdfViewer');
            pdfViewer.src = url;
        })
        .catch(error => {
            console.error('Error fetching PDF URL:', error);
        })
        .finally(() => {
            hideLoading();
        });
    });

    document.getElementById('logoutButton').addEventListener('click', function() {
        localStorage.removeItem('jwt'); // Remove the JWT from local storage
        window.location.href = '/login.html'; // Redirect to the login page
    });

    document.getElementById('backButton').addEventListener('click', function() {
        window.location.href = '/doctor.html'; // Redirect to the doctor page
    });
</script>

</body>
</html>
