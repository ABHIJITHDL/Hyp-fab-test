<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHR Patient Records</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Background and Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-image: linear-gradient(to right, #83a4d4, #b6fbff);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* Navigation Bar */
        .navbar {
            width: 100%;
            background-color: #7791a8;
            padding: 15px 0;
            text-align: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        /* Main Content Wrapper */
        .content-wrapper {
            width: 750px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Content Container Styling */
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Dropdown and Button Styling */
        select, button {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .status-button {
            background-color: #0073e6;
            color: white;
            border: none;
        }

        .status-button:hover {
            background-color: #005bb5;
        }

        /* Doctor Actions Row */
        .doctor-actions-row {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
            margin-top: 10px;
        }

        .doctor-id-display {
            font-weight: bold;
            color: #333;
            margin-right: auto;
            padding-left: 10px;
        }

        .doctor-button {
            padding: 10px;
            font-size: 14px;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            flex: 1;
            text-align: center;
        }

        .accept-button {
            background-color: #4CAF50;
        }

        .accept-button:hover {
            background-color: #45a049;
        }

        .revoke-button {
            background-color: #f44336;
        }

        .revoke-button:hover {
            background-color: #d32f2f;
        }

        /* Hide Doctor Actions and Accepted Doctors initially */
        #doctor-container, #doctor-list {
            display: none;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<div class="navbar">Electronic Health Record System</div>

<!-- Main Content Wrapper -->
<div class="content-wrapper">

    <!-- Patient Dashboard Container -->
    <div class="container" id="status-container">
        <h2>Patient Dashboard</h2>
        <form id="status-form" action="" method="POST">
            <label for="status">Choose Status:</label>
            <select name="status" id="status" required onchange="toggleDoctorActions()">
                <option value="Accepted">Accepted</option>
                <option value="Pending">Pending</option>
            </select>
        </form>
        <div id="doctor-list">
            <h2>Accepted Doctors</h2>
            <ul id="doctor-list-ul"></ul>
        </div>
    </div>

    <!-- Doctor Actions Container -->
    <div class="container" id="doctor-container">
        <h2>Doctor Actions</h2>
        <div class="doctor-actions-row">
            <!-- Doctor ID Display -->
            <div class="doctor-id-display" id="doctor-id">Doctor ID: D12345</div>
            <!-- Accept and Revoke Buttons -->
            <button class="doctor-button accept-button" onclick="handleAction('Accept')">Accept</button>
            <button class="doctor-button revoke-button" onclick="handleAction('Revoke')">Revoke</button>
        </div>
    </div>

</div>

<script>
    let dataFetched = false; // Flag to check if data has already been fetched

    // Toggle visibility of Doctor Actions and fetch accepted doctors based on status selection
    function toggleDoctorActions() {
        const status = document.getElementById("status").value;
        const doctorContainer = document.getElementById("doctor-container");
        const doctorList = document.getElementById("doctor-list");

        if (status === "Accepted") {
            doctorContainer.style.display = "none";
            doctorList.style.display = "block";
            if (!dataFetched) {
                fetchDoctorData();
            }
        } else if (status === "Pending") {
            doctorContainer.style.display = "block";
            doctorList.style.display = "none";
        } else {
            doctorContainer.style.display = "none";
            doctorList.style.display = "none";
        }
    }

    // Handle Accept and Revoke button actions
    function handleAction(action) {
        const doctorId = document.getElementById("doctor-id").textContent;
        alert(`Doctor Action: ${action} for ${doctorId}`);
        // Add server-side handling for actions
    }

    // Fetch doctor data
    function fetchDoctorData() {
        console.log(localStorage.getItem('jwt'));
        fetch('/fabric/patient/accepted', {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('jwt')}` // Assuming JWT is stored in localStorage
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log(data);
            const doctorListUl = document.getElementById('doctor-list-ul');
            doctorListUl.innerHTML = ''; // Clear any existing content
            data.forEach(doctorId => {
                const li = document.createElement('li');
                li.classList.add('doctor-actions-row');
                
                const doctorIdDiv = document.createElement('div');
                doctorIdDiv.classList.add('doctor-id-display');
                doctorIdDiv.textContent = `Doctor ID: ${doctorId}`;
                
                const button = document.createElement('button');
                button.classList.add('doctor-button');
                button.textContent = 'View History';
                button.onclick = () => viewHistory(doctorId);
                
                li.appendChild(doctorIdDiv);
                li.appendChild(button);
                doctorListUl.appendChild(li);
            });
            dataFetched = true; // Set the flag to true after data is fetched
        })
        .catch(error => {
            console.error('Error fetching doctor data:', error);
        });
    }

    // Function to handle View History button click
    function viewHistory(doctorId) {
        alert(`Viewing history for Doctor ID: ${doctorId}`);
        // Add logic to fetch and display the doctor's history
    }

    // Call the function to fetch and display doctor data when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        const status = document.getElementById("status").value;
        if (status === "Accepted") {
            fetchDoctorData();
        }
    });
</script>

</body>
</html>
