<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.1/jsrsasign-all-min.js"></script>
    <script>
        function log(message) {
            console.log(message);
            document.getElementById('result').innerHTML += message + '<br>';
        }

        function loadPrivateKey() {
            log('Loading private key...');
            const fileInput = document.getElementById('privateKeyFile');
            const file = fileInput.files[0];

            if (!file) {
                log('Error: No file selected');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const privateKey = KEYUTIL.getKey(e.target.result);
                    log('Private key loaded successfully');
                    window.privateKey = privateKey;
                    window.privateKeyPem = e.target.result; // Store PEM content
                } catch (error) {
                    log('Error loading private key: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function loadPublicKey() {
            log('Loading public key...');
            const fileInput = document.getElementById('publicKeyFile');
            const file = fileInput.files[0];

            if (!file) {
                log('Error: No file selected');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const publicKey = e.target.result;
                    log('Public key loaded successfully');
                    window.publicKey = publicKey;
                } catch (error) {
                    log('Error loading public key: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        async function login() {
            log('Attempting login...');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                log('Error: Username and password are required');
                return;
            }

            if (!window.privateKey || !window.publicKey) {
                log('Error: Private key or public key not loaded');
                return;
            }

            try {
                log('Creating signature...');
                const sig = new KJUR.crypto.Signature({"alg": "SHA256withRSA"});
                sig.init(window.privateKey);
                sig.updateString(username + password);
                const signature = sig.sign();

                log('Signature created successfully');
                const base64Signature = hex2b64(signature);

                // Send data to the backend
                const data = {
                    username: username,
                    signature: base64Signature,
                    publicKey: window.publicKey,
                    privateKey: window.privateKeyPem // Add private key PEM
                };

                const response = await fetch('http://localhost:8080/fabric/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                log('Login successful: ' + JSON.stringify(result));

            } catch (error) {
                log('Error during login process: ' + error.message);
            }
        }
    </script>
</head>
<body>
<h1>Login</h1>

<h2>Step 1: Load Private Key</h2>
<div class="form-group">
    <label for="privateKeyFile">Private Key File (PEM or DER format):</label>
    <input type="file" id="privateKeyFile">
</div>
<button onclick="loadPrivateKey()">Load Private Key</button>

<h2>Step 2: Load Public Key</h2>
<div class="form-group">
    <label for="publicKeyFile">Public Key File (PEM format):</label>
    <input type="file" id="publicKeyFile">
</div>
<button onclick="loadPublicKey()">Load Public Key</button>

<h2>Step 3: Login</h2>
<div class="form-group">
    <label for="username">Username:</label>
    <input type="text" id="username">
</div>
<div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password">
</div>
<button onclick="login()">Login</button>

<div id="result"></div>
</body>
</html>
